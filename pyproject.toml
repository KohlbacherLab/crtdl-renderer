[project]
name = "crtdl-renderer"
version = "1.0.0"
description = "Renders MII/FDPG feasibility queries (CRTDL/CCDL) as readable German documents — Markdown, DOCX, PDF, CSV"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Kohlbacher Lab, University of Tübingen" }]
keywords = ["fhir", "mii", "fdpg", "crtdl", "ccdl", "feasibility", "cohort", "medical-informatics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Natural Language :: German",
]
dependencies = []

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
pdf = ["reportlab>=4.0"]
all = ["python-docx>=1.1", "reportlab>=4.0"]

[project.urls]
Homepage = "https://github.com/KohlbacherLab/crtdl-renderer"
Repository = "https://github.com/KohlbacherLab/crtdl-renderer"
Issues = "https://github.com/KohlbacherLab/crtdl-renderer/issues"

[project.scripts]
crtdl-render = "crtdl_renderer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["crtdl_renderer"]

[tool.setuptools.package-data]
crtdl_renderer = ["terminology_de.json"]

[tool.ruff]
line-length = 96
target-version = "py311"
